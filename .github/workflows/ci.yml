name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install linters
        run: sudo apt-get update && sudo apt-get install -y cppcheck shellcheck clang-format
      - name: clang-format
        run: clang-format --dry-run --Werror src/*.c src/*.h tests/*.c tests/*.h
      - name: cppcheck
        run: >
          cppcheck --enable=warning,portability --std=c11 --error-exitcode=1
          --inline-suppr --suppress=missingIncludeSystem -I src src/*.c
      - name: shellcheck (sh)
        run: shellcheck -s sh customize.sh service.sh uninstall.sh action.sh system/bin/lockem
      - name: shellcheck (bash)
        run: shellcheck -s bash build.sh pack.sh tests/run_tests.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host unit tests (ASan + UBSan)
        run: bash tests/run_tests.sh

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Set up NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: true
      - name: Build daemon (arm64-v8a + x86_64)
        run: bash build.sh
      - name: Package module zip
        run: bash pack.sh
      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: lockem-module
          path: dist/lockem-*.zip
          if-no-files-found: error

  # A push to main that changes update.json's version publishes a release for it:
  # the tag (= that version) is created by `gh release create` on the pushed commit.
  release-check:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect version bump in update.json
        id: check
        env:
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version="$(jq -r .version update.json)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          old=""
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            old="$(git show "$BEFORE:update.json" 2>/dev/null | jq -r .version || true)"
          fi
          if [ "$version" = "$old" ]; then
            echo "update.json version unchanged ($version); no release"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh release view "$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $version already exists; no release"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # update.json, module.prop and the zip URL must all agree before publishing
          code="$(jq -r .versionCode update.json)"
          url="$(jq -r .zipUrl update.json)"
          prop_version="$(sed -n 's/^version=//p' module.prop)"
          prop_code="$(sed -n 's/^versionCode=//p' module.prop)"
          want_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${version}/lockem-${version}.zip"
          [ "$prop_version" = "$version" ] || { echo "::error::module.prop version=$prop_version != update.json $version"; exit 1; }
          [ "$prop_code" = "$code" ] || { echo "::error::module.prop versionCode=$prop_code != update.json $code"; exit 1; }
          [ "$url" = "$want_url" ] || { echo "::error::update.json zipUrl=$url, expected $want_url"; exit 1; }
          echo "releasing $version (was ${old:-none})"
          echo "release=true" >> "$GITHUB_OUTPUT"

  release:
    if: needs.release-check.outputs.release == 'true'
    needs: [build, release-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the release
      id-token: write        # attestation OIDC
      attestations: write    # write provenance
    steps:
      - uses: actions/checkout@v4
      - name: Download module artifact
        uses: actions/download-artifact@v4
        with:
          name: lockem-module
          path: dist
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/lockem-*.zip
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release-check.outputs.version }}
        run: >
          gh release create "${VERSION}"
          dist/lockem-*.zip
          --repo "${GITHUB_REPOSITORY}"
          --target "${GITHUB_SHA}"
          --title "lockem ${VERSION}"
          --generate-notes
